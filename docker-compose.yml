# Local dev stack.
#
#   make download
#   make local
#
# `make local` starts MinIO, creates the bucket, creates LanceDB embeddings only if
# they are missing, then runs backend/frontend with hot reload.

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot job that creates the "wine" bucket.
  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/wine;
      echo 'bucket ready';
      "

  backend:
    build:
      context: ./backend
      args:
        EMBEDDING_MODEL_SOURCE: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      secrets:
        - hf_token
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      createbuckets:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment: &backend_env
      LANCEDB_URI: s3://wine/lancedb
      AWS_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_ALLOW_HTTP: "true"
      AWS_REGION: us-east-1
      CORS_ORIGINS: http://localhost:5173,http://0.0.0.0:5173
      LLM_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN:-}
      HF_TOKEN: ${HUGGINGFACE_TOKEN:-}
    volumes:
      - ./backend/app:/app/app
      - ./backend/data:/data

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      VITE_API_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules

  # Tool service used by `make local` for idempotent local ingestion.
  ingest:
    build:
      context: ./backend
      args:
        EMBEDDING_MODEL_SOURCE: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      secrets:
        - hf_token
    profiles: ["tools"]
    depends_on:
      createbuckets:
        condition: service_completed_successfully
    environment: *backend_env
    volumes:
      - ./backend/app:/app/app
      - ./backend/data:/data
    entrypoint: ["uv", "run", "python", "-m", "app.ingest"]

volumes:
  minio-data:
  frontend-node-modules:

secrets:
  hf_token:
    environment: HUGGINGFACE_TOKEN
