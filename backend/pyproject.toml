[project]
name = "wine-in-a-million"
version = "1.0.0"
description = "Semantic + LLM-powered wine recommender backed by LanceDB on object storage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "lancedb>=0.15",
    "pyarrow>=17",
    "sentence-transformers>=3.3",
    "torch>=2.6,<3",
    "pandas>=2.2",
    "numpy>=1.26",
    "httpx>=0.27",
    "openai>=1.54",
    "tqdm>=4.66",
    "gcsfs>=2024.10",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "platform_system == 'Linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
